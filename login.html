<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Luyện Đề Master</title>
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="box hide" id="box">
  <div class="brand"><div class="logo">📚</div><h1>Luyện Đề Master</h1><p class="sub">Chào mừng quay lại, cùng ôn thi nào!</p></div>
  <nav class="tabs"><a class="on" href="/login">Đăng nhập</a><a href="/register">Đăng ký</a></nav>
  <label class="f"><span>Tên đăng nhập</span><div class="in"><i>👤</i><input id="u" autocomplete="username" autocapitalize="none" placeholder="Nhập tên đăng nhập"></div></label>
  <label class="f"><span>Mật khẩu</span><div class="in"><i>🔒</i><input id="p" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"><button class="eye" type="button" tabindex="-1">👁</button></div></label>
  <div class="err" id="err"></div>
  <button class="main" id="go">Đăng nhập</button>
  <p class="alt">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
</main>
<script type="module">
import { db, saveSession, clearSession, keyOf, checkFirebaseBan } from "/js/core.js";
import { findAdmin } from "/js/config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { $, go, sha256Hex, redirectIfLoggedIn, bindEyes, busy } from "/js/auth-common.js";

bindEyes();
if (await redirectIfLoggedIn()) { $("box").classList.remove("hide"); $("u").focus(); }

async function login(u, p) {
  const admin = findAdmin(u);
  if (admin) {
    if (await sha256Hex(p) !== admin.passHash) throw new Error("Sai mật khẩu.");
    const a = admin.profile;
    saveSession({ key: keyOf(a.username), username: a.username, name: a.name, cls: a.cls, isAdmin: true });
    return;
  }
  if (!db) throw new Error("Chưa kết nối được máy chủ.");
  const key = keyOf(u);
  const snap = await get(ref(db, "accounts/" + key));
  if (!snap.exists()) throw new Error("Tài khoản không tồn tại.");
  const acc = snap.val();
  if (await checkFirebaseBan(acc.username)) { clearSession(); throw new Error("Tài khoản đã bị khóa."); }
  if (acc.passHash !== await sha256Hex(p)) throw new Error("Sai mật khẩu.");
  saveSession({ key, username: acc.username, name: acc.name, cls: acc.cls || "" });
}

async function submit() {
  $("err").textContent = "";
  const u = $("u").value.trim(), p = $("p").value;
  if (!u || !p) { $("err").textContent = "Vui lòng nhập đầy đủ."; return; }
  busy($("go"), true);
  try { await login(u, p); go(); }
  catch (e) { $("err").textContent = e.message; busy($("go"), false, "Đăng nhập"); }
}
$("go").onclick = submit;
$("p").onkeydown = $("u").onkeydown = (e) => { if (e.key === "Enter") submit(); };
</script>
</body>
</html>
