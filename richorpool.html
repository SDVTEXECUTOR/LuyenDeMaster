<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>👑 Đại Gia · Luyện Đề Master</title>
<style>
:root{--gold:#fbbf24;--gold2:#f59e0b;--ink:#f8fafc;--mut:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(900px 500px at 50% -10%,#3b2a06 0,transparent 65%),radial-gradient(700px 500px at 100% 100%,#312e81 0,transparent 60%),#07070f;padding:0 14px 90px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
background-image:radial-gradient(2px 2px at 20% 30%,#fde68a,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 85% 65%,#fde68a,transparent),radial-gradient(1.5px 1.5px at 35% 80%,#fff,transparent),radial-gradient(2px 2px at 55% 55%,#fde68a,transparent);
background-size:420px 420px;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:420px 420px}}
.wrap{position:relative;max-width:760px;margin:0 auto}
.back{position:absolute;left:0;top:18px;color:var(--mut);text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07)}
.back:hover{color:#fff;background:rgba(255,255,255,.14)}
header{text-align:center;padding:64px 0 14px}
h1{margin:0;font-size:clamp(1.8rem,6vw,2.7rem);font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,#fde68a,#fbbf24,#f97316,#fbbf24,#fde68a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{margin:6px 0 14px;color:var(--mut);font-size:.92rem}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(251,191,36,.25);font-size:.85rem;color:#fde68a;font-weight:700}
.tools{display:flex;gap:8px;margin:18px 0 14px}
.tools input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:.95rem}
.tools input:focus{outline:0;border-color:var(--gold)}
.tools button{padding:0 16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1c1100;font-weight:800;cursor:pointer;font-size:1.1rem}
/* Podium */
#podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:10px;align-items:end;margin:10px 0 18px}
.pc{position:relative;border-radius:20px;padding:30px 10px 16px;text-align:center;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;border:2px solid var(--rim);box-shadow:0 0 28px var(--glow);transition:transform .25s}
.pc:hover{transform:translateY(-4px)}
.pc.r1{--rim:#fbbf24;--glow:rgba(251,191,36,.55);padding-top:40px}.pc.r2{--rim:#cbd5e1;--glow:rgba(203,213,225,.35)}.pc.r3{--rim:#d6803f;--glow:rgba(214,128,63,.4)}
.pc .crown{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:1.7rem;animation:bob 2.4s ease-in-out infinite}
.pc .medal{position:absolute;top:8px;left:10px;font-size:1.3rem}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.av{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:rgba(255,255,255,.14);border:2px solid var(--rim,rgba(255,255,255,.3));overflow:hidden}
.pc.r1 .av{width:80px;height:80px;font-size:2.5rem}.av img{width:100%;height:100%;object-fit:cover}
.pn{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcl{font-size:.74rem;color:rgba(255,255,255,.65);margin-top:1px}
.pm{margin-top:8px;font-weight:900;font-size:1.05rem;color:#fde68a;text-shadow:0 0 14px rgba(251,191,36,.6)}.pc.r1 .pm{font-size:1.25rem}
/* Nền người chơi đã chọn */
.bg-default{background:linear-gradient(160deg,#1e3a8a 0%,#1e293b 60%,#0f172a 100%)}
.bg-pack_fire{background:radial-gradient(ellipse at 50% 120%,rgba(255,90,0,.85) 0%,transparent 60%),linear-gradient(180deg,#1a0400 0%,#5a1300 100%)}
.bg-pack_fire::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 100%,rgba(255,170,0,.5),transparent 40%),radial-gradient(circle at 80% 100%,rgba(255,60,0,.5),transparent 40%);animation:flame 1.6s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes flame{from{opacity:.45;transform:translateY(6px)}to{opacity:1;transform:translateY(-4px)}}
.bg-pack_fire .pn,.bg-pack_fire .nm{color:#ffd29a;text-shadow:0 0 10px rgba(255,110,0,.7)}
/* Danh sách */
.row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:9px;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.1);transition:transform .2s;animation:in .4s both}
.row{cursor:pointer}.row:hover{transform:translateX(4px)}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.row>*{position:relative;z-index:1}.row.me{border:2px solid #34d399;box-shadow:0 0 18px rgba(52,211,153,.35)}
.rk{width:34px;text-align:center;font-weight:900;font-size:1rem;color:var(--mut)}
.row .av{width:44px;height:44px;margin:0;font-size:1.4rem;flex:none}
.inf{flex:1;min-width:0}.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl{font-size:.75rem;color:rgba(255,255,255,.6)}
.cn{font-weight:900;color:#fde68a;white-space:nowrap}.cn small{font-size:.7rem;color:#fbbf24;opacity:.8}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:#34d399;color:#022c22;font-size:.65rem;font-weight:800;vertical-align:middle}
#me{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(7,7,15,.9);backdrop-filter:blur(14px);border-top:1px solid rgba(251,191,36,.3);text-align:center;font-weight:700;color:#fde68a;font-size:.92rem}
.empty{text-align:center;color:var(--mut);padding:40px 0}

/* Bảng thông tin người chơi */
.mk{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,3,10,.74);backdrop-filter:blur(8px)}.mk.on{display:flex}.mk.cf{z-index:30}
.md{position:relative;width:100%;max-width:400px;max-height:92vh;overflow:auto;border-radius:24px;padding:26px 18px 18px;text-align:center;border:2px solid var(--rim,rgba(255,255,255,.22));box-shadow:0 0 44px var(--glow,rgba(0,0,0,.55));animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}}
.md>*{position:relative;z-index:1}.md.sm{max-width:340px}
.md.r1{--rim:#fbbf24;--glow:rgba(251,191,36,.5)}.md.r2{--rim:#cbd5e1;--glow:rgba(203,213,225,.35)}.md.r3{--rim:#d6803f;--glow:rgba(214,128,63,.4)}
.md .x{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:1rem;cursor:pointer;z-index:2}
.md .av{width:92px;height:92px;font-size:2.8rem;margin-bottom:10px}
.md h2{margin:0;font-size:1.3rem}.md .s2{color:rgba(255,255,255,.66);font-size:.85rem;margin-top:2px}
.rankb{display:inline-block;margin:12px 0 4px;padding:6px 18px;border-radius:99px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1100}
.big{font-size:1.9rem;font-weight:900;color:#fde68a;text-shadow:0 0 18px rgba(251,191,36,.6)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.cell{padding:10px 6px;border-radius:14px;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.1)}.cell b{display:block;font-size:.98rem}.cell small{color:rgba(255,255,255,.62);font-size:.72rem}
.bio{font-size:.86rem;color:rgba(255,255,255,.82);font-style:italic;margin:8px 0 0}
.act{display:flex;gap:8px;margin-top:14px}.act button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:800;font-size:.92rem;cursor:pointer}
.b1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1100}.b2{background:rgba(255,255,255,.14);color:#fff}
.cft{font-size:1.1rem;font-weight:800;margin:4px 0 6px}.cfp{font-size:.86rem;color:rgba(255,255,255,.72);margin:0}

/* Màn hình loading sang chảnh */
#ld{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(700px 520px at 50% 38%,#3b2a06 0,#0a0806 62%,#05050b 100%);transition:opacity .6s,transform .6s}
#ld.out{opacity:0;transform:scale(1.06);pointer-events:none}
#ld>*:not(#ldRain){position:relative;z-index:1}
#ldRain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#ldRain span{position:absolute;top:-40px;opacity:.85;animation:fall linear infinite;filter:drop-shadow(0 0 8px rgba(251,191,36,.6))}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.cw{position:relative;width:120px;height:120px;margin-bottom:6px}
.cw::after{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.38),transparent 65%);animation:halo 2s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.25);opacity:.6}}
.coin{position:relative;z-index:1;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.5rem;letter-spacing:.04em;color:#7a4a00;background:radial-gradient(circle at 30% 28%,#fff3b0,#fbbf24 45%,#b45309 100%);box-shadow:0 0 0 6px #b45309,0 0 0 9px #fde68a,0 0 50px rgba(251,191,36,.7);animation:spinc 1.7s linear infinite}
.coin::before{content:"";position:absolute;inset:12px;border-radius:50%;border:3px dashed rgba(122,74,0,.55)}
@keyframes spinc{to{transform:rotateY(360deg)}}
.ldt{margin:34px 0 4px;font-size:clamp(1.4rem,5vw,2rem);font-weight:900;text-align:center;background:linear-gradient(90deg,#fde68a,#fbbf24,#f97316,#fbbf24,#fde68a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
.ldm{color:#94a3b8;font-size:.9rem;min-height:1.3em;text-align:center}
.ldb{width:min(280px,72vw);height:10px;margin-top:18px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(251,191,36,.3)}
.ldb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#b45309,#fbbf24,#fff3b0);box-shadow:0 0 14px rgba(251,191,36,.8);transition:width .5s ease}
.ldp{margin-top:8px;color:#fde68a;font-weight:800;font-size:.85rem}
@media(max-width:520px){#podium{gap:6px}.pc{padding:30px 4px 12px}.av{width:50px;height:50px;font-size:1.5rem}.pc.r1 .av{width:62px;height:62px}.pn{font-size:.8rem}.pm{font-size:.85rem}.pc.r1 .pm{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div id="ld">
  <div id="ldRain"></div>
  <div class="cw"><div class="coin">LDM</div></div>
  <div class="ldt">👑 ĐẠI GIA LUYỆN ĐỀ</div>
  <div class="ldm" id="ldMsg">Đang mở két sắt…</div>
  <div class="ldb"><i id="ldBar"></i></div>
  <div class="ldp" id="ldPct">0%</div>
</div>
<div class="wrap">
  <a class="back" href="/">← Trang chủ</a>
  <header>
    <h1>👑 ĐẠI GIA LUYỆN ĐỀ</h1>
    <p class="sub">Bảng xếp hạng người giàu nhất · tính theo xu LDM</p>
    <div class="stats"><span class="chip" id="sPlayers">👥 …</span><span class="chip" id="sTotal">💰 …</span></div>
  </header>
  <div class="tools"><input id="q" placeholder="🔎 Tìm theo tên hoặc lớp…" autocomplete="off"><button id="rf" title="Làm mới">↻</button></div>
  <section id="podium"></section>
  <section id="list"><div class="empty">Đang tải bảng xếp hạng…</div></section>
</div>
<div class="mk" id="mk"><div class="md" id="md"></div></div>
<div class="mk cf" id="cf"><div class="md sm bg-default" id="cfBox"></div></div>
<div id="me">…</div>

<script type="module">
import { db, loadSession, keyOf } from "/js/core.js";
import { ref, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = (id) => document.getElementById(id);
const session = loadSession();
if (!session) location.replace("/login");
const myKey = session ? keyOf(session.username) : "";
const fmt = (n) => Number(n || 0).toLocaleString("vi-VN");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const bgClass = (b) => "bg-" + (/^[a-z0-9_]{1,40}$/i.test(b || "") ? b : "default");
const medal = ["🥇", "🥈", "🥉"];
let ALL = [];
/* Tài khoản bị ẩn khỏi bảng xếp hạng (so khớp theo key hoặc username, không phân biệt hoa thường) */
const BLOCKED = new Set(["announce-ai"]);

function avatar(p) {
  const img = typeof p.avatarImg === "string" && p.avatarImg.startsWith("data:image/") ? p.avatarImg : "";
  return img ? `<img src="${esc(img)}" alt="">` : esc(p.avatar || "🙂");
}
function link(p) { return "/profile_" + encodeURIComponent(p.username); }

function countUp(el, to) {
  const t0 = performance.now(), d = 900;
  (function step(t) {
    const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(to * e));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function render() {
  const kw = $("q").value.trim().toLowerCase();
  const rows = ALL.map((p, i) => ({ ...p, rank: i + 1 }));
  const shown = kw ? rows.filter((p) => (p.name + " " + p.username + " " + p.cls).toLowerCase().includes(kw)) : rows;

  const top = kw ? [] : rows.slice(0, 3);
  const order = [top[1], top[0], top[2]].filter(Boolean);
  $("podium").innerHTML = order.map((p) => `
    <div class="pc r${p.rank} ${bgClass(p.activeBg)}" data-i="${p.rank - 1}" role="button" tabindex="0">
      ${p.rank === 1 ? '<span class="crown">👑</span>' : ""}<span class="medal">${medal[p.rank - 1]}</span>
      <div class="av">${avatar(p)}</div>
      <div class="pn">${esc(p.name)}</div><div class="pcl">${p.cls ? "Lớp " + esc(p.cls) : "@" + esc(p.username)}</div>
      <div class="pm"><span data-n="${p.coins}">0</span> 🪙</div>
    </div>`).join("");
  $("podium").style.display = top.length ? "" : "none";

  const rest = kw ? shown : rows.slice(3);
  $("list").innerHTML = rest.length ? rest.map((p, i) => `
    <div class="row ${bgClass(p.activeBg)} ${p.key === myKey ? "me" : ""}" data-i="${p.rank - 1}" role="button" tabindex="0" style="animation-delay:${Math.min(i, 14) * 35}ms">
      <div class="rk">#${p.rank}</div><div class="av">${avatar(p)}</div>
      <div class="inf"><div class="nm">${esc(p.name)}${p.key === myKey ? '<span class="tag">BẠN</span>' : ""}</div><div class="cl">${p.cls ? "Lớp " + esc(p.cls) + " · " : ""}@${esc(p.username)}</div></div>
      <div class="cn">${fmt(p.coins)} <small>LDM</small></div>
    </div>`).join("") : (top.length ? "" : '<div class="empty">Không tìm thấy ai 😢</div>');
  document.querySelectorAll("[data-n]").forEach((el) => countUp(el, +el.dataset.n));
}

const LD_T0 = performance.now();
function setP(n, msg) {
  const b = $("ldBar"); if (!b) return;
  b.style.width = n + "%"; $("ldPct").textContent = n + "%";
  if (msg) $("ldMsg").textContent = msg;
}
function hideLoader() {
  const el = $("ld"); if (!el || el.dataset.done) return;
  el.dataset.done = 1; setP(100, "Chào mừng đại gia! 👑");
  const wait = Math.max(0, 1700 - (performance.now() - LD_T0));
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 700); }, wait);
}
(function rain() {
  const r = $("ldRain"), em = ["🪙", "💰", "💎", "🪙", "💵"];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("span");
    s.textContent = em[i % em.length]; s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = 16 + Math.random() * 18 + "px";
    s.style.animationDuration = 3 + Math.random() * 3 + "s"; s.style.animationDelay = -Math.random() * 5 + "s";
    r.appendChild(s);
  }
})();
setTimeout(hideLoader, 12000); /* phòng khi mạng chậm: không để kẹt màn hình loading */

async function load() {
  $("rf").disabled = true;
  setP(12, "Đang mở két sắt…");
  try {
    const snap = await get(query(ref(db, "profiles"), orderByChild("coins"), limitToLast(110)));
    setP(55, "Đang đếm từng đồng xu…");
    const list = [];
    snap.forEach((c) => { const v = c.val() || {}; list.push({ key: c.key, coins: Number(v.coins) || 0, avatar: v.avatar, avatarImg: v.avatarImg, activeBg: v.activeBg, bio: v.bio, totalQuizzes: v.totalQuizzes, streak: v.streak, createdAt: v.createdAt, ach: v.achievements && typeof v.achievements === "object" ? Object.keys(v.achievements).length : 0 }); });
    list.sort((a, b) => b.coins - a.coins);
    const accs = await Promise.all(list.map((p) => get(ref(db, "accounts/" + p.key)).then((s) => s.val()).catch(() => null)));
    setP(85, "Đang xếp hạng các đại gia…");
    ALL = list.map((p, i) => accs[i] ? { ...p, username: accs[i].username, name: accs[i].name || accs[i].username, cls: accs[i].cls || "" } : null).filter(Boolean)
      .filter((p) => !BLOCKED.has(String(p.key).toLowerCase()) && !BLOCKED.has(String(p.username).toLowerCase()))
      .slice(0, 100);
    $("sPlayers").textContent = "👥 " + fmt(ALL.length) + " người chơi";
    $("sTotal").textContent = "💰 " + fmt(ALL.reduce((s, p) => s + p.coins, 0)) + " LDM";
    render();
    setP(100, "Hoàn tất!");
    const i = ALL.findIndex((p) => p.key === myKey);
    if (i >= 0) $("me").textContent = `Bạn đang hạng #${i + 1} · ${fmt(ALL[i].coins)} LDM`;
    else {
      const mine = await get(ref(db, `profiles/${myKey}/coins`)).catch(() => null);
      $("me").textContent = mine && mine.exists() ? `Bạn có ${fmt(mine.val())} LDM · chưa lọt top 100` : "Hãy làm bài để kiếm xu và leo hạng!";
    }
  } catch (e) {
    $("list").innerHTML = '<div class="empty">❌ Không tải được bảng xếp hạng: ' + esc(e.message) + "</div>";
  }
  $("rf").disabled = false;
  hideLoader();
}

/* ── Bảng thông tin người chơi + xác nhận xem hồ sơ ── */
let cur = null;
function openInfo(i) {
  const p = ALL[i]; if (!p) return; cur = p;
  const rank = i + 1, up = ALL[i - 1], down = ALL[i + 1];
  const total = ALL.reduce((s, x) => s + x.coins, 0) || 1;
  const joined = p.createdAt ? new Date(p.createdAt).toLocaleDateString("vi-VN") : "—";
  const bgName = p.activeBg === "pack_fire" ? "🔥 Lửa" : "🌌 Mặc định";
  const md = $("md");
  md.className = "md " + bgClass(p.activeBg) + (rank <= 3 ? " r" + rank : "");
  md.innerHTML = `
    <button class="x" id="mx" aria-label="Đóng">✕</button>
    <div class="av">${avatar(p)}</div>
    <h2 class="nm">${esc(p.name)}${p.key === myKey ? '<span class="tag">BẠN</span>' : ""}</h2>
    <div class="s2">@${esc(p.username)}${p.cls ? " · Lớp " + esc(p.cls) : ""}</div>
    <div class="rankb">${rank <= 3 ? medal[rank - 1] + " " : ""}Top ${rank}</div>
    <div class="big">${fmt(p.coins)} 🪙</div>
    ${p.bio ? `<p class="bio">“${esc(p.bio)}”</p>` : ""}
    <div class="grid">
      <div class="cell"><b>${up ? "+" + fmt(up.coins - p.coins) : "👑 Dẫn đầu"}</b><small>Cách hạng trên</small></div>
      <div class="cell"><b>${down ? "+" + fmt(p.coins - down.coins) : "—"}</b><small>Hơn hạng dưới</small></div>
      <div class="cell"><b>${(p.coins / total * 100).toFixed(1)}%</b><small>Tổng xu toàn server</small></div>
      <div class="cell"><b>${fmt(p.totalQuizzes)}</b><small>Bài đã làm</small></div>
      <div class="cell"><b>🔥 ${fmt(p.streak)}</b><small>Chuỗi ngày học</small></div>
      <div class="cell"><b>🎖️ ${fmt(p.ach)}</b><small>Thành tích</small></div>
      <div class="cell"><b>${esc(joined)}</b><small>Ngày tham gia</small></div>
      <div class="cell"><b>${bgName}</b><small>Nền đang dùng</small></div>
    </div>
    <div class="act"><button class="b2" id="mc">Đóng</button><button class="b1" id="mv">👤 Xem hồ sơ</button></div>`;
  $("mk").classList.add("on");
  $("mx").onclick = $("mc").onclick = closeInfo;
  $("mv").onclick = askProfile;
}
function closeInfo() { $("mk").classList.remove("on"); }
function askProfile() {
  if (!cur) return;
  const box = $("cfBox");
  box.innerHTML = `<div style="font-size:2rem">👤</div><div class="cft">Xem hồ sơ của ${esc(cur.name)}?</div>
    <p class="cfp">Bạn sẽ rời bảng xếp hạng để mở trang hồ sơ của @${esc(cur.username)}.</p>
    <div class="act"><button class="b2" id="cn">Không</button><button class="b1" id="cy">Có, xem hồ sơ</button></div>`;
  $("cf").classList.add("on");
  $("cn").onclick = closeConfirm;
  $("cy").onclick = () => { location.href = link(cur); };
}
function closeConfirm() { $("cf").classList.remove("on"); }
const pick = (e) => { const el = e.target.closest("[data-i]"); if (el) openInfo(+el.dataset.i); };
$("podium").onclick = $("list").onclick = pick;
$("podium").onkeydown = $("list").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); } };
$("mk").onclick = (e) => { if (e.target === $("mk")) closeInfo(); };
$("cf").onclick = (e) => { if (e.target === $("cf")) closeConfirm(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("cf").classList.contains("on")) closeConfirm(); else closeInfo(); } });

$("q").oninput = render;
$("rf").onclick = load;
load();
</script>
</body>
</html>
