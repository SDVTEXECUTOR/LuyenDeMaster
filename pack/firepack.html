<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🔥 PACK FIRE — Xem trước</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--mut:#94a3b8;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 100%,#2b0500 0%,#0a0200 50%,#04060f 100%);
  color:#f1f5f9;isolation:isolate;perspective:900px}

/* ════════ AMBIENT ════════ */
.fp-ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 85%,rgba(255,120,30,.35),transparent 70%);
  animation:fpAmbient 2.3s ease-in-out infinite;mix-blend-mode:overlay}
@keyframes fpAmbient{0%,100%{opacity:.55}22%{opacity:.85}41%{opacity:.4}63%{opacity:.9}80%{opacity:.5}}

/* ════════ SVG FIRE ════════ */
.fp-svg{position:fixed;left:0;right:0;bottom:0;width:100%;height:85%;z-index:1;
  pointer-events:none;mix-blend-mode:screen;opacity:.95}

/* ════════ SMOKE ════════ */
.fp-smoke{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.fp-smoke span{position:absolute;bottom:38%;left:50%;
  width:var(--sw,90px);height:var(--sw,90px);border-radius:50%;
  background:radial-gradient(circle,rgba(70,60,60,.5) 0%,rgba(40,35,35,.25) 45%,transparent 75%);
  filter:blur(10px);opacity:0;animation:fpSmoke var(--dur,6s) ease-out infinite;
  animation-delay:var(--delay,0s)}
@keyframes fpSmoke{
  0%{transform:translate(-50%,0) scale(.3) rotate(0deg);opacity:0}
  15%{opacity:.5}
  60%{opacity:.35;transform:translate(calc(-50% + var(--dx,0)*.5),-180px) scale(1.3) rotate(40deg)}
  100%{transform:translate(calc(-50% + var(--dx,0)),-340px) scale(2) rotate(90deg);opacity:0}
}

/* ════════ FLAME ════════ */
.fp-flame-back,.fp-flame-front{position:fixed;left:0;right:0;pointer-events:none}
.fp-flame-back{bottom:0;height:80%;z-index:2}
.fp-flame-front{bottom:0;height:55%;z-index:8;opacity:.75;mix-blend-mode:screen}
.fp-flame{position:absolute;bottom:0;width:var(--w,40px);height:var(--h,100px);
  left:var(--x,50%);margin-left:calc(var(--w,40px)/-2);
  border-radius:50% 50% 35% 35%/70% 70% 30% 30%;
  background:radial-gradient(ellipse 70% 90% at center bottom,
    rgba(255,255,240,1) 0%,rgba(255,245,100,.95) 15%,rgba(255,180,30,.9) 35%,
    rgba(255,100,0,.7) 60%,rgba(200,30,0,.35) 85%,rgba(120,10,0,0) 100%);
  filter:blur(var(--blur,4px));transform-origin:center bottom;
  animation:fpFlame var(--dur,1.5s) ease-in-out infinite alternate;
  animation-delay:var(--delay,0s);will-change:transform,opacity}
@keyframes fpFlame{
  0%{transform:translateY(0) scaleY(.9) scaleX(1) rotate(0deg);opacity:.75}
  30%{transform:translateY(-12px) scaleY(1.15) scaleX(.92) rotate(var(--r1,-3deg));opacity:1}
  60%{transform:translateY(-8px) scaleY(1.05) scaleX(1.05) rotate(var(--r2,4deg));opacity:.9}
  100%{transform:translateY(-18px) scaleY(1.25) scaleX(.88) rotate(var(--r3,-2deg));opacity:1}
}
.fp-flame.mini{filter:blur(2px);opacity:.85}
.fp-flame.big{filter:blur(8px);opacity:.7}

/* ════════ EMBERS ════════ */
.fp-embers{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.fp-embers span{position:absolute;bottom:30%;left:50%;
  width:var(--size,5px);height:var(--size,5px);border-radius:50%;
  background:radial-gradient(circle,#fffde7 0%,#ffcc00 30%,#ff6a00 60%,#ff2200 100%);
  box-shadow:0 0 8px #ff8800,0 0 16px #ff4400,0 0 24px rgba(255,60,0,.6);
  filter:blur(.4px);opacity:0;animation:fpEmber var(--dur,2.5s) ease-out infinite;
  animation-delay:var(--delay,0s);will-change:transform,opacity}
@keyframes fpEmber{
  0%{transform:translate(-50%,0) scale(.2);opacity:0}
  10%{opacity:1;transform:translate(calc(-50% + var(--dx,0)*.15),-20px) scale(1)}
  70%{opacity:.9;transform:translate(calc(-50% + var(--dx,0)*.8),-160px) scale(.8)}
  100%{transform:translate(calc(-50% + var(--dx,0)),-250px) scale(.2);opacity:0}
}

/* ════════ HAZE ════════ */
.fp-haze{position:fixed;left:0;right:0;bottom:30%;height:40%;z-index:9;
  pointer-events:none;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);
  -webkit-mask-image:linear-gradient(to top,black,transparent);
  mask-image:linear-gradient(to top,black,transparent);
  animation:fpHaze 2.6s ease-in-out infinite alternate;opacity:.5}
@keyframes fpHaze{0%{transform:translateX(-4px) scaleY(1)}100%{transform:translateX(4px) scaleY(1.03)}}

/* ════════ RAYS ════════ */
.fp-rays{position:fixed;left:50%;top:52%;width:560px;height:560px;
  margin:-280px 0 0 -280px;z-index:4;pointer-events:none;mix-blend-mode:screen;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,90,.35) 0deg 4deg,transparent 4deg 18deg);
  -webkit-mask:radial-gradient(circle,black 10%,transparent 62%);
  mask:radial-gradient(circle,black 10%,transparent 62%);
  animation:fpRays 14s linear infinite}
@keyframes fpRays{to{transform:rotate(360deg)}}

/* ════════ DEMON ════════ */
.fp-demon{position:fixed;left:50%;bottom:-4%;transform:translateX(-50%);
  width:320px;height:420px;z-index:3;pointer-events:none;
  animation:fpDemonSway 7s ease-in-out infinite}
.fp-demon svg{width:100%;height:100%;
  filter:drop-shadow(0 0 30px rgba(255,80,0,.55)) drop-shadow(0 0 60px rgba(255,40,0,.3))}
@keyframes fpDemonSway{
  0%,100%{transform:translateX(-50%) rotate(-1.4deg) scale(1)}
  50%{transform:translateX(-50%) rotate(1.4deg) scale(1.015)}
}
.fp-demon-eye{animation:fpEyePulse 1.4s ease-in-out infinite alternate}
@keyframes fpEyePulse{
  0%{opacity:.5;filter:drop-shadow(0 0 4px #ff2200)}
  100%{opacity:1;filter:drop-shadow(0 0 14px #ff5500)}
}

/* ════════ SKULLS ════════ */
.fp-skulls{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:visible}
.fp-skull{position:absolute;left:-18%;top:var(--fy,30%);width:80px;height:66px;
  transform:scale(var(--fsc,1));animation:fpSkull var(--fdur,3.2s) ease-in-out forwards;
  filter:drop-shadow(0 0 10px rgba(255,120,20,.85)) drop-shadow(0 0 24px rgba(255,60,0,.55))}
.fp-skull svg{width:100%;height:100%;display:block}
.fp-skull .fp-trail{position:absolute;right:90%;top:50%;width:48px;height:16px;
  transform:translateY(-50%);
  background:linear-gradient(90deg,transparent,rgba(255,140,30,.75));
  filter:blur(5px);border-radius:999px}
.fp-skull-eye{animation:fpEyePulse 1s ease-in-out infinite alternate}
@keyframes fpSkull{
  0%{transform:translate(0,0) rotate(-10deg) scale(calc(var(--fsc,1)*.6));opacity:0}
  8%{opacity:1}
  30%{transform:translate(32vw,calc(var(--arc,1)*-46px)) rotate(6deg) scale(var(--fsc,1))}
  50%{transform:translate(58vw,calc(var(--arc,1)*34px)) rotate(-8deg) scale(calc(var(--fsc,1)*1.06))}
  72%{transform:translate(84vw,calc(var(--arc,1)*-24px)) rotate(7deg) scale(var(--fsc,1))}
  92%{opacity:1}
  100%{transform:translate(118vw,0) rotate(-5deg) scale(calc(var(--fsc,1)*.6));opacity:0}
}

/* ════════ STREAKS ════════ */
.fp-streaks{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.fp-streak{position:absolute;left:var(--sx,0);top:var(--sy,50%);
  width:var(--sl,220px);height:var(--sth,3px);border-radius:999px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,240,180,0) 0%,
    rgba(255,220,120,.9) 55%,rgba(255,255,255,1) 100%);
  filter:blur(.6px) drop-shadow(0 0 6px rgba(255,160,40,.9)) drop-shadow(0 0 14px rgba(255,90,0,.6));
  transform:rotate(var(--sr,-18deg));opacity:0;
  animation:fpStreak var(--sdur,1.1s) cubic-bezier(.2,.8,.3,1) forwards;
  animation-delay:var(--sdelay,0s)}
@keyframes fpStreak{
  0%{opacity:0;transform:rotate(var(--sr,-18deg)) translateX(-60px) scaleX(.3)}
  8%{opacity:1}
  70%{opacity:.9}
  100%{opacity:0;transform:rotate(var(--sr,-18deg)) translateX(var(--sdx,520px)) scaleX(1)}
}

/* ════════ VIGNETTE ════════ */
.fp-vignette{position:fixed;inset:0;z-index:10;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(2,2,6,.55) 100%)}

/* ════════ CENTER CONTENT ════════ */
.fp-content{position:fixed;inset:0;z-index:20;
  display:grid;place-items:center;padding:20px;overflow-y:auto}
.fp-inner{max-width:400px;width:100%;text-align:center;position:relative}

.fp-badge{display:inline-block;background:rgba(255,140,50,.2);color:#ffb347;
  padding:6px 16px;border-radius:99px;font-size:.78rem;font-weight:800;
  letter-spacing:.08em;margin-bottom:20px;
  border:1px solid rgba(255,140,50,.4);backdrop-filter:blur(10px)}

.fp-close{position:absolute;top:-10px;right:0;width:40px;height:40px;padding:0;
  border-radius:50%;background:rgba(0,0,0,.5);color:#fff;
  border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;
  font-size:1.2rem;cursor:pointer;backdrop-filter:blur(10px);
  box-shadow:none;transition:all .2s}
.fp-close:hover{background:rgba(220,38,38,.8);transform:scale(1.1)}
.fp-close.hide-standalone{display:none}

/* Mock profile */
.fp-card{background:rgba(20,10,5,.85);
  border:1px solid rgba(255,100,30,.35);border-radius:20px;
  padding:32px 24px;backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(255,80,0,.25),inset 0 1px 0 rgba(255,150,60,.15);
  animation:fpSlideUp .5s cubic-bezier(.34,1.56,.64,1) .15s both}
@keyframes fpSlideUp{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}

.fp-avatar-stage{position:relative;width:160px;height:160px;
  margin:0 auto 20px;display:grid;place-items:center;
  animation:fpBreath 2.6s ease-in-out infinite}
@keyframes fpBreath{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.03) translateY(-3px)}}
.fp-avatar{width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#3a1a08,#0a0300);
  display:grid;place-items:center;font-size:3rem;position:relative;z-index:5;
  border:3px solid rgba(255,150,50,.5);
  box-shadow:0 0 25px rgba(255,100,0,.7),0 0 50px rgba(255,60,0,.5),
             0 0 80px rgba(255,40,0,.3),inset 0 0 15px rgba(255,150,50,.4);
  animation:fpAvatarCore 1.8s ease-in-out infinite alternate;overflow:hidden}
@keyframes fpAvatarCore{
  0%{box-shadow:0 0 25px rgba(255,100,0,.7),0 0 50px rgba(255,60,0,.5),
    0 0 80px rgba(255,40,0,.3),inset 0 0 15px rgba(255,150,50,.4)}
  100%{box-shadow:0 0 42px rgba(255,150,20,1),0 0 80px rgba(255,80,0,.75),
    0 0 120px rgba(255,50,0,.55),inset 0 0 25px rgba(255,210,90,.65)}
}
.fp-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.fp-rim-ring{position:absolute;inset:-6px;border-radius:50%;z-index:6;
  pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,220,120,0) 0deg,
    rgba(255,220,120,.9) 40deg,rgba(255,120,20,0) 90deg,
    rgba(255,220,120,0) 300deg,rgba(255,220,120,.6) 340deg,
    rgba(255,220,120,0) 360deg);
  -webkit-mask:radial-gradient(circle,transparent 62%,black 64%,black 68%,transparent 70%);
  mask:radial-gradient(circle,transparent 62%,black 64%,black 68%,transparent 70%);
  animation:fpRing 5s linear infinite;opacity:.85}
@keyframes fpRing{to{transform:rotate(360deg)}}
.fp-avatar-glow{position:absolute;inset:-50px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,60,.5) 0%,
    rgba(255,100,0,.35) 30%,rgba(200,30,0,.2) 55%,transparent 80%);
  filter:blur(28px);z-index:3;animation:fpGlow 2s ease-in-out infinite alternate;
  pointer-events:none}
@keyframes fpGlow{0%{transform:scale(.95);opacity:.7}100%{transform:scale(1.15);opacity:1}}

.fp-name{font-size:1.4rem;font-weight:900;margin:0 0 4px;color:#fff5e6;
  text-shadow:0 0 20px rgba(255,150,50,.6);position:relative;z-index:1}
.fp-user{color:#ffaa44;font-weight:600;font-size:.9rem;margin-bottom:20px;
  position:relative;z-index:1}
.fp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:16px;position:relative;z-index:1}
.fp-stat{background:rgba(255,80,0,.1);border:1px solid rgba(255,100,30,.35);
  border-radius:10px;padding:12px 8px}
.fp-stat-val{font-size:1.3rem;font-weight:900;color:#ffb347;line-height:1.2;
  font-variant-numeric:tabular-nums}
.fp-stat-lbl{font-size:.7rem;color:#d4a574;font-weight:600;margin-top:2px;
  text-transform:uppercase;letter-spacing:.03em}
.fp-note{font-size:.78rem;color:#d4a574;font-style:italic;padding:10px;
  background:rgba(255,80,0,.08);border-radius:8px;line-height:1.5;
  position:relative;z-index:1}
.fp-note b{color:#ffb347;font-style:normal}

.fp-equip-burst{position:absolute;inset:0;pointer-events:none;z-index:100;
  display:grid;place-items:center}
.fp-equip-burst span{position:absolute;width:10px;height:10px;border-radius:50%;
  background:#fff;box-shadow:0 0 16px currentColor,0 0 32px currentColor;
  opacity:0;animation:fpBurst 1s ease-out forwards}
@keyframes fpBurst{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--bx),var(--by)) scale(0);opacity:0}
}
.fp-shockwave{position:absolute;left:50%;top:50%;width:40px;height:40px;
  margin:-20px 0 0 -20px;border-radius:50%;
  border:3px solid rgba(255,200,100,.9);z-index:99;pointer-events:none;
  animation:fpShock .7s ease-out forwards}
@keyframes fpShock{
  0%{transform:scale(1);opacity:.9}
  100%{transform:scale(9);opacity:0}
}

.fp-actions{display:flex;gap:10px;margin-top:20px;position:relative;z-index:20;
  animation:fpSlideUp .5s cubic-bezier(.34,1.56,.64,1) .25s both}
.fp-actions button{flex:1;padding:14px;font-size:.95rem;
  border:0;border-radius:12px;font:inherit;font-weight:700;
  cursor:pointer;transition:all .2s}
.fp-btn-close{background:rgba(255,255,255,.1);color:#fff;
  border:1px solid rgba(255,255,255,.2)!important}
.fp-btn-close:hover{background:rgba(255,255,255,.2)}
.fp-btn-buy{background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;
  box-shadow:0 6px 20px rgba(220,38,38,.5)}
.fp-btn-buy:hover{filter:brightness(1.1);transform:translateY(-1px)}
.fp-btn-buy:disabled{background:linear-gradient(135deg,#16a34a,#22c55e);
  opacity:.85;cursor:not-allowed}
.fp-btn-buy:disabled:hover{transform:none;filter:none}

/* Standalone nav (khi không ở trong iframe) */
.fp-standalone-nav{position:fixed;top:16px;left:16px;z-index:30}
.fp-standalone-nav a{display:inline-block;padding:8px 16px;border-radius:10px;
  background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.2);
  text-decoration:none;font-weight:600;font-size:.85rem;backdrop-filter:blur(10px)}
.fp-standalone-nav a:hover{background:rgba(0,0,0,.7)}

@media (max-width:480px){
  .fp-avatar-stage{width:130px;height:130px}
  .fp-avatar{width:80px;height:80px;font-size:2.4rem}
  .fp-name{font-size:1.2rem}
  .fp-stat-val{font-size:1.1rem}
  .fp-actions button{padding:12px;font-size:.88rem}
  .fp-demon{width:240px;height:320px}
  .fp-skull{width:56px;height:46px}
}
@media (prefers-reduced-motion:reduce){
  .fp-flame,.fp-embers span,.fp-smoke span,.fp-avatar-stage,.fp-avatar,
  .fp-avatar-glow,.fp-rim-ring,.fp-ambient,.fp-haze{animation:none!important}
}
</style>
</head>
<body>

<!-- Standalone nav (chỉ hiện khi mở trực tiếp, không trong iframe) -->
<div class="fp-standalone-nav" id="fpStandaloneNav" style="display:none">
  <a href="/shop">← Về Shop</a>
</div>

<!-- Fire scene -->
<div class="fp-ambient"></div>

<svg class="fp-svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="fpTurbMain" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.1" numOctaves="3" seed="5">
        <animate attributeName="baseFrequency" dur="3s" values="0.012 0.1;0.018 0.13;0.015 0.11;0.012 0.1" repeatCount="indefinite"/>
        <animate attributeName="seed" dur="8s" values="5;15;25;5" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="55"/>
    </filter>
    <filter id="fpTurbDeep" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.12" numOctaves="2" seed="20">
        <animate attributeName="baseFrequency" dur="4.5s" values="0.02 0.12;0.025 0.15;0.02 0.12" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="40"/>
    </filter>
    <radialGradient id="fpFireCore" cx="50%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#fffde7"/><stop offset="15%" stop-color="#ffef5a"/>
      <stop offset="35%" stop-color="#ffcc00"/><stop offset="55%" stop-color="#ff8800"/>
      <stop offset="75%" stop-color="#ff4400"/><stop offset="90%" stop-color="#cc1100" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#440000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fpFireDeep" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff6600" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="300" cy="540" rx="320" ry="160" fill="url(#fpFireDeep)" filter="url(#fpTurbDeep)" opacity="0.85"/>
  <ellipse cx="300" cy="520" rx="240" ry="130" fill="url(#fpFireCore)" filter="url(#fpTurbMain)"/>
  <ellipse cx="200" cy="420" rx="80" ry="100" fill="url(#fpFireCore)" filter="url(#fpTurbMain)" opacity="0.7"/>
  <ellipse cx="400" cy="420" rx="80" ry="100" fill="url(#fpFireCore)" filter="url(#fpTurbMain)" opacity="0.7"/>
</svg>

<div class="fp-flame-back" id="fpFlameBack"></div>

<div class="fp-demon">
  <svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="fpTurbDemon" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="2" seed="7">
          <animate attributeName="seed" dur="6s" values="7;19;7" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="14"/>
      </filter>
      <linearGradient id="fpDemonFill" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#ff5a00" stop-opacity="0.9"/>
        <stop offset="30%" stop-color="#7a1200" stop-opacity="0.88"/>
        <stop offset="65%" stop-color="#200400" stop-opacity="0.92"/>
        <stop offset="100%" stop-color="#0a0300" stop-opacity="0.95"/>
      </linearGradient>
      <radialGradient id="fpDemonEye" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff7cc"/>
        <stop offset="35%" stop-color="#ffb020"/>
        <stop offset="100%" stop-color="#ff2200"/>
      </radialGradient>
    </defs>
    <g filter="url(#fpTurbDemon)">
      <path d="M120,160 C85,172 62,220 52,282 L76,300 L64,340 L92,352 L80,392 L112,398 L100,432 L138,436 L126,472 L168,470 L160,512 L200,506 L240,512 L232,470 L274,472 L262,436 L300,432 L288,398 L320,392 L308,352 L336,340 L324,300 L348,282 C338,220 315,172 280,160 C258,142 230,130 200,128 C170,130 142,142 120,160 Z" fill="url(#fpDemonFill)" stroke="rgba(255,140,40,.55)" stroke-width="2"/>
      <path d="M112,158 C66,150 32,112 24,58 C48,90 76,118 104,142 Z" fill="url(#fpDemonFill)" stroke="rgba(255,140,40,.5)" stroke-width="2"/>
      <path d="M288,158 C334,150 368,112 376,58 C352,90 324,118 296,142 Z" fill="url(#fpDemonFill)" stroke="rgba(255,140,40,.5)" stroke-width="2"/>
      <ellipse cx="200" cy="92" rx="46" ry="50" fill="#0c0300" stroke="rgba(255,120,30,.6)" stroke-width="2"/>
      <path d="M168,58 C158,22 146,-10 122,-28 C140,-2 150,30 164,66 Z" fill="#0c0300" stroke="rgba(255,120,30,.6)" stroke-width="2"/>
      <path d="M232,58 C242,22 254,-10 278,-28 C260,-2 250,30 236,66 Z" fill="#0c0300" stroke="rgba(255,120,30,.6)" stroke-width="2"/>
    </g>
    <ellipse class="fp-demon-eye" cx="180" cy="88" rx="7" ry="4.5" fill="url(#fpDemonEye)"/>
    <ellipse class="fp-demon-eye" cx="220" cy="88" rx="7" ry="4.5" fill="url(#fpDemonEye)" style="animation-delay:.3s"/>
  </svg>
</div>

<div class="fp-rays"></div>
<div class="fp-smoke" id="fpSmoke"></div>
<div class="fp-embers" id="fpEmbers"></div>
<div class="fp-streaks" id="fpStreaks"></div>

<div class="fp-content">
  <div class="fp-inner">
    <button class="fp-close" id="fpClose" type="button">✕</button>
    <div class="fp-badge">🔍 ĐANG XEM TRƯỚC</div>
    <div class="fp-card">
      <div class="fp-avatar-stage" id="fpAvatarStage">
        <div class="fp-avatar-glow"></div>
        <div class="fp-rim-ring"></div>
        <div class="fp-avatar" id="fpAvatar">🐱</div>
      </div>
      <h2 class="fp-name" id="fpName">Tên của bạn</h2>
      <div class="fp-user" id="fpUser">@username</div>
      <div class="fp-stats">
        <div class="fp-stat"><div class="fp-stat-val">42</div><div class="fp-stat-lbl">Bài đã làm</div></div>
        <div class="fp-stat"><div class="fp-stat-val">🔥 7</div><div class="fp-stat-lbl">Streak</div></div>
        <div class="fp-stat"><div class="fp-stat-val" id="fpCoins">—</div><div class="fp-stat-lbl">LDM</div></div>
      </div>
      <div class="fp-note">
        💡 Đây chỉ là preview — sau khi mua, nền lửa sẽ áp dụng cho <b>toàn bộ Profile</b> của bạn
      </div>
    </div>
    <div class="fp-actions">
      <button class="fp-btn-close" id="fpBtnClose" type="button">Đóng</button>
      <button class="fp-btn-buy" id="fpBtnBuy" type="button">🔥 Mua ngay 499 LDM</button>
    </div>
  </div>
</div>

<div class="fp-haze"></div>
<div class="fp-flame-front" id="fpFlameFront"></div>
<div class="fp-skulls" id="fpSkulls"></div>
<div class="fp-vignette"></div>

<script type="module">
import {
  db, loadSession, keyOf,
  getUserCoins, getOwnedPacks, SHOP_ITEMS
} from '/js/core.js';
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = id => document.getElementById(id);
const session = loadSession();

/* ═══ IFRAME DETECTION ═══ */
const inIframe = window.parent !== window.self;

if (!inIframe) {
  // Mở trực tiếp → hiện nút "Về Shop", đổi text nút
  $("fpStandaloneNav").style.display = "block";
  $("fpClose").classList.add("hide-standalone");
}

/* ═══ FIRE EFFECTS ═══ */
function createFlameBlob({x, w, h, dur, delay, blur, mini, big}) {
  const r1 = (Math.random() - 0.5) * 16;
  const r2 = (Math.random() - 0.5) * 16;
  const r3 = (Math.random() - 0.5) * 16;
  const cls = ['fp-flame'];
  if (mini) cls.push('mini');
  if (big) cls.push('big');
  return `<div class="${cls.join(' ')}" style="--x:${x}%;--w:${w}px;--h:${h}px;--dur:${dur}s;--delay:${delay}s;--blur:${blur}px;--r1:${r1.toFixed(1)}deg;--r2:${r2.toFixed(1)}deg;--r3:${r3.toFixed(1)}deg;"></div>`;
}

function spawnFlameBack() {
  const blobs = [];
  const N = 45;
  for (let i = 0; i < N; i++) {
    const xBase = (i / N) * 100;
    const x = xBase + (Math.random() - 0.5) * 4;
    const distFromCenter = Math.abs(x - 50) / 50;
    const heightFactor = 1 - distFromCenter * 0.65;
    const isBig = Math.random() < 0.3;
    const isMini = Math.random() < 0.25;
    const w = isBig ? 45 + Math.random() * 35 : isMini ? 14 + Math.random() * 18 : 28 + Math.random() * 26;
    const h = (isBig ? 130 : isMini ? 45 : 75) * heightFactor + Math.random() * 55;
    const dur = 1.2 + Math.random() * 1.5;
    const delay = Math.random() * 2;
    const blur = isBig ? 8 : isMini ? 2 : 4;
    blobs.push(createFlameBlob({x, w, h, dur, delay, blur, mini: isMini, big: isBig}));
  }
  $("fpFlameBack").innerHTML = blobs.join('');
}

function spawnFlameFront() {
  const blobs = [];
  const N = 18;
  for (let i = 0; i < N; i++) {
    const x = 20 + Math.random() * 60;
    const w = 14 + Math.random() * 22;
    const h = 28 + Math.random() * 55;
    const dur = 1.5 + Math.random() * 1.2;
    const delay = Math.random() * 2;
    const blur = 2 + Math.random() * 2;
    blobs.push(createFlameBlob({x, w, h, dur, delay, blur, mini: true}));
  }
  $("fpFlameFront").innerHTML = blobs.join('');
}

function spawnEmbers() {
  let html = '';
  const N = 28;
  for (let i = 0; i < N; i++) {
    const size = 3 + Math.random() * 7;
    const dur = 2 + Math.random() * 2.5;
    const delay = Math.random() * 3;
    const dx = (Math.random() - 0.5) * 180;
    html += `<span style="--size:${size.toFixed(1)}px;--dur:${dur.toFixed(2)}s;--delay:${delay.toFixed(2)}s;--dx:${dx.toFixed(0)}px;"></span>`;
  }
  $("fpEmbers").innerHTML = html;
}

function spawnSmoke() {
  let html = '';
  const N = 9;
  for (let i = 0; i < N; i++) {
    const sw = 55 + Math.random() * 75;
    const dur = 5 + Math.random() * 3;
    const delay = Math.random() * 6;
    const dx = (Math.random() - 0.5) * 140;
    html += `<span style="--sw:${sw.toFixed(0)}px;--dur:${dur.toFixed(2)}s;--delay:${delay.toFixed(2)}s;--dx:${dx.toFixed(0)}px;left:${30 + Math.random() * 40}%;"></span>`;
  }
  $("fpSmoke").innerHTML = html;
}

const SKULL_SVG = `<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="fpSkullFire" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#fff2b0"/><stop offset="30%" stop-color="#ffb020"/><stop offset="60%" stop-color="#ff5500"/><stop offset="100%" stop-color="#2a0500"/></radialGradient></defs><path d="M60,8 C30,8 16,30 16,52 C16,66 22,76 30,84 L34,96 L46,90 L50,98 L60,92 L70,98 L74,90 L86,96 L90,84 C98,76 104,66 104,52 C104,30 90,8 60,8 Z" fill="url(#fpSkullFire)" stroke="rgba(120,20,0,.6)" stroke-width="2"/><path d="M22,46 C14,34 14,16 24,4 C20,20 22,34 28,46 Z" fill="url(#fpSkullFire)"/><path d="M98,46 C106,34 106,16 96,4 C100,20 98,34 92,46 Z" fill="url(#fpSkullFire)"/><ellipse cx="42" cy="46" rx="11" ry="13" fill="#1a0300"/><ellipse cx="78" cy="46" rx="11" ry="13" fill="#1a0300"/><circle class="fp-skull-eye" cx="42" cy="46" r="5" fill="#ff2200"/><circle class="fp-skull-eye" cx="78" cy="46" r="5" fill="#ff2200" style="animation-delay:.25s"/><path d="M60,54 L66,66 L54,66 Z" fill="#1a0300"/></svg>`;

let skullTimer = null;
function spawnSkull() {
  const el = $("fpSkulls");
  const s = document.createElement('div');
  s.className = 'fp-skull';
  const fy = 10 + Math.random() * 50;
  const arc = (Math.random() < 0.5 ? 1 : -1) * (0.7 + Math.random() * 0.8);
  const fdur = 2.8 + Math.random() * 1.2;
  const fsc = 0.7 + Math.random() * 0.5;
  s.style.setProperty('--fy', fy + '%');
  s.style.setProperty('--arc', arc.toFixed(2));
  s.style.setProperty('--fdur', fdur.toFixed(2) + 's');
  s.style.setProperty('--fsc', fsc.toFixed(2));
  s.innerHTML = SKULL_SVG + '<div class="fp-trail"></div>';
  el.appendChild(s);
  setTimeout(() => s.remove(), fdur * 1000 + 300);
}
function startSkulls() {
  spawnSkull();
  skullTimer = setTimeout(startSkulls, 4200 + Math.random() * 3200);
}

let streakTimer = null;
function spawnStreak() {
  const el = $("fpStreaks");
  const s = document.createElement('div');
  s.className = 'fp-streak';
  const fromLeft = Math.random() < 0.5;
  const sy = 20 + Math.random() * 55;
  const sl = 150 + Math.random() * 160;
  const sr = (Math.random() * 26 - 13) - (fromLeft ? 0 : 180);
  const sdur = 0.8 + Math.random() * 0.6;
  const sdx = (fromLeft ? 1 : -1) * (440 + Math.random() * 160);
  s.style.setProperty('--sx', fromLeft ? '-10%' : '110%');
  s.style.setProperty('--sy', sy + '%');
  s.style.setProperty('--sl', sl.toFixed(0) + 'px');
  s.style.setProperty('--sr', sr.toFixed(1) + 'deg');
  s.style.setProperty('--sdur', sdur.toFixed(2) + 's');
  s.style.setProperty('--sdx', sdx.toFixed(0) + 'px');
  el.appendChild(s);
  setTimeout(() => s.remove(), sdur * 1000 + 200);
}
function startStreaks() {
  spawnStreak();
  if (Math.random() < 0.4) setTimeout(spawnStreak, 120 + Math.random() * 200);
  streakTimer = setTimeout(startStreaks, 900 + Math.random() * 1400);
}

function playEquipEffect() {
  const stage = $("fpAvatarStage");
  const avatar = $("fpAvatar");
  if (avatar) {
    avatar.style.filter = "brightness(3.5)";
    setTimeout(() => { avatar.style.filter = ""; }, 600);
  }
  const shock = document.createElement('div');
  shock.className = 'fp-shockwave';
  stage.appendChild(shock);
  setTimeout(() => shock.remove(), 750);

  const burst = document.createElement('div');
  burst.className = 'fp-equip-burst';
  const colors = ['#ffcc00','#ffaa00','#ff6600','#ff2200','#fff7cc','#ff4400'];
  const N = 50;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('span');
    const angle = (i / N) * Math.PI * 2 + Math.random() * 0.4;
    const dist = 100 + Math.random() * 180;
    s.style.setProperty('--bx', `${(Math.cos(angle) * dist).toFixed(0)}px`);
    s.style.setProperty('--by', `${(Math.sin(angle) * dist).toFixed(0)}px`);
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.color = s.style.background;
    s.style.width = s.style.height = `${4 + Math.random() * 10}px`;
    s.style.animationDelay = `${Math.random() * 0.2}s`;
    burst.appendChild(s);
  }
  stage.appendChild(burst);
  setTimeout(() => burst.remove(), 1400);
}

/* ═══ LOAD USER DATA ═══ */
async function loadUserData() {
  // Ưu tiên session (khi trong iframe cùng origin, đọc được localStorage)
  if (session && session.username) {
    try {
      const k = keyOf(session.username);
      const snap = await get(ref(db, `profiles/${k}`));
      const prof = snap.exists() ? snap.val() : {};

      $("fpName").textContent = session.name || session.username;
      $("fpUser").textContent = "@" + session.username + (session.cls ? " · Lớp " + session.cls : "");

      const avatarEl = $("fpAvatar");
      if (prof.avatarImg) {
        avatarEl.innerHTML = `<img src="${prof.avatarImg}" alt="avatar">`;
      } else {
        avatarEl.innerHTML = "";
        avatarEl.textContent = prof.avatar || "🐱";
      }

      const coins = await getUserCoins(session.username);
      $("fpCoins").textContent = coins.toLocaleString("vi-VN");

      const owned = await getOwnedPacks(session.username);
      const btnBuy = $("fpBtnBuy");
      if (owned.includes("pack_fire")) {
        btnBuy.textContent = "✓ Đã sở hữu";
        btnBuy.disabled = true;
      } else {
        btnBuy.textContent = "🔥 Mua ngay 499 LDM";
        btnBuy.disabled = false;
      }
    } catch(e) {
      console.warn("[firepack] load data:", e);
    }
  } else {
    // Chưa login
    $("fpName").textContent = "Tên của bạn";
    $("fpUser").textContent = "@username (chưa đăng nhập)";
    $("fpCoins").textContent = "0";
    const btnBuy = $("fpBtnBuy");
    btnBuy.textContent = "🔒 Cần đăng nhập";
    btnBuy.disabled = true;
  }
}

/* ═══ ACTIONS ═══ */
function notifyParent(type) {
  if (!inIframe) return false;
  try {
    window.parent.postMessage({ type }, "*");
    return true;
  } catch(e) {
    return false;
  }
}

$("fpClose").onclick = () => {
  if (inIframe) notifyParent("firepack:close");
  else location.href = "/shop";
};
$("fpBtnClose").onclick = () => {
  if (inIframe) notifyParent("firepack:close");
  else location.href = "/shop";
};
$("fpBtnBuy").onclick = () => {
  if ($("fpBtnBuy").disabled) return;
  if (inIframe) notifyParent("firepack:buy");
  else location.href = "/shop"; // standalone: về shop để mua
};

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (inIframe) notifyParent("firepack:close");
    else location.href = "/shop";
  }
});

/* ═══ INIT ═══ */
spawnFlameBack();
spawnFlameFront();
spawnEmbers();
spawnSmoke();
startStreaks();
setTimeout(startSkulls, 1200);
loadUserData();
setTimeout(playEquipEffect, 300);
</script>
</body>
</html>
