<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cutscene: Học Sinh vs Boss Điểm Kém</title>
<style>
:root{--gold:#ffd700;--blue:#4169e1;--red:#ff3333;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#000;font-family:Arial,sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center}
.wrap{width:900px;height:500px;flex:none;transform-origin:center}
.stage{position:relative;width:900px;height:500px;background:linear-gradient(180deg,#87ceeb,#b0e0e6 50%,#deb887);overflow:hidden;border:3px solid var(--blue);box-shadow:0 0 40px var(--blue)}
.fx{position:absolute;pointer-events:none;white-space:nowrap}
.board{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:500px;height:150px;background:#1a3a1a;border:8px solid #8b4513;border-radius:5px;box-shadow:inset 0 0 20px #0008;color:#fff;font:28px 'Comic Sans MS',cursive;text-align:center;padding-top:30px}
.ground{position:absolute;bottom:0;width:100%;height:80px;background:repeating-linear-gradient(90deg,#8b4513 0 45px,#654321 45px 50px);border-top:3px solid #3a1a0a}
.hero{position:absolute;bottom:80px;left:100px;width:80px;height:140px;transition:transform .35s ease}
.hero>div{position:absolute}
.h-hair{bottom:125px;left:15px;width:50px;height:22px;background:#1a1a1a;border-radius:50% 50% 0 0;z-index:2}
.h-head{bottom:95px;left:18px;width:45px;height:45px;background:#ffd9a8;border-radius:50%;border:2px solid #8b4513}
.h-eye{bottom:112px;width:6px;height:6px;background:#000;border-radius:50%;z-index:3}
.h-mouth{bottom:102px;left:35px;width:12px;height:4px;background:#c0392b;border-radius:0 0 10px 10px;z-index:3}
.h-body{bottom:15px;left:13px;width:55px;height:85px;background:linear-gradient(#fff,#f0f0f0);border-radius:8px;border:2px solid #ccc}
.h-tie{bottom:60px;left:38px;border:8px solid transparent;border-top:35px solid #c0392b;border-bottom:0;z-index:2}
.h-pants{bottom:0;left:18px;width:45px;height:25px;background:#1a237e;border-radius:0 0 5px 5px}
.h-bag{bottom:40px;left:-5px;width:25px;height:30px;background:#e74c3c;border-radius:4px;border:2px solid #922b21}
.h-pen{bottom:40px;right:-25px;width:6px;height:90px;background:linear-gradient(#000 15%,var(--gold) 15% 85%,#c0c0c0 85% 95%,#333 95%);transform-origin:bottom;transform:rotate(-20deg);transition:transform .2s;box-shadow:0 0 15px var(--gold);border-radius:2px}
.hero.atk .h-pen{transform:rotate(60deg)}
.name{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-weight:bold;font-size:14px;white-space:nowrap}
.boss{position:absolute;bottom:80px;right:80px;width:180px;height:220px;transition:transform .4s ease}
.paper{position:absolute;bottom:0;left:10px;width:160px;height:200px;background:linear-gradient(#fff8dc,#f5deb3);border:3px solid #8b0000;border-radius:5px;box-shadow:0 0 30px red,inset 0 0 20px #8b00004d;transform:rotate(-3deg)}
.grade{position:absolute;top:20px;left:50%;font:bold 90px 'Comic Sans MS',cursive;color:#8b0000;text-shadow:3px 3px 0 red,0 0 20px red;animation:gs 1s infinite}
@keyframes gs{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg)}}
.eye{position:absolute;top:120px;width:22px;height:22px;background:#fff;border:3px solid #8b0000;border-radius:50%;animation:eg 1.5s infinite}
.eye::after{content:'';position:absolute;top:5px;left:5px;width:10px;height:10px;background:#8b0000;border-radius:50%}
@keyframes eg{0%,100%{box-shadow:0 0 15px red}50%{box-shadow:0 0 30px #ff0}}
.mouth{position:absolute;top:155px;left:50%;transform:translateX(-50%);width:60px;height:20px;background:#000;border:2px solid #8b0000;border-radius:0 0 50% 50%}
.label{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:#8b0000;font:bold 20px 'Comic Sans MS',cursive;white-space:nowrap}
.boss.dying{animation:die 2.2s forwards}
@keyframes die{0%{transform:scale(1)}20%{transform:scale(1.3) rotate(10deg);filter:brightness(3)}50%{transform:scale(1.5) rotate(-15deg);filter:brightness(5)}100%{transform:scale(0) rotate(720deg);opacity:0;filter:brightness(10)}}
.bar{position:absolute;top:200px;width:220px;height:22px;background:#333;border:2px solid #fff;border-radius:5px;overflow:hidden;z-index:5}
.bar i{display:block;height:100%;width:100%;transition:width .5s}
.tag{position:absolute;top:226px;font-weight:bold;font-size:13px;text-shadow:2px 2px 4px #000;z-index:5}
.dlg{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:80%;background:#000e;border:2px solid var(--gold);border-radius:10px;padding:12px 24px;color:#fff;font-size:17px;text-align:center;opacity:0;transition:opacity .4s;z-index:10}
.dlg.show{opacity:1}
.dlg b{display:block;margin-bottom:4px;font-size:15px}
.victory{position:absolute;top:42%;left:50%;color:var(--gold);font:bold 60px 'Comic Sans MS',cursive;letter-spacing:3px;text-shadow:0 0 30px red,4px 4px 0 #8b0000;z-index:20;white-space:nowrap}
.end{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity 1.5s;z-index:50;color:#fff}
.end.show{opacity:1;pointer-events:auto}
.end h1{font:bold 110px 'Comic Sans MS',cursive;color:var(--gold);text-shadow:0 0 40px #ff8c00,5px 5px 0 #8b0000;letter-spacing:10px}
.end button{padding:10px 30px;background:var(--gold);border:0;border-radius:5px;font:bold 16px Arial;cursor:pointer}
.end button:hover{background:#fff}
@media (prefers-reduced-motion:reduce){.grade,.eye{animation:none}}
.boss.rage .paper{width:192px;height:244px;left:-6px;background:linear-gradient(#3a0000,#120000);border-color:#f00;box-shadow:0 0 50px #f00,0 0 110px #ff6a00,inset 0 0 35px #f00}
.boss.rage .grade{color:#ff2b2b;font-size:110px;animation:gs .14s infinite;text-shadow:0 0 28px #ff0,3px 3px 0 #700}
.boss.rage .eye{background:#ff0;border-color:#f00;animation:eg .25s infinite}
.boss.rage .mouth{width:96px;height:38px;background:#300;top:168px}
.boss.rage .label{color:#ff5a5a;font-size:22px}
.hero.burst .h-hair{background:#ffd700;box-shadow:0 0 18px #ffd700}
.hero.burst .h-eye{background:#0ff;box-shadow:0 0 8px #0ff}
.hero.burst .h-body{background:linear-gradient(#fffbe0,#ffd700);border-color:#fff}
.hero.burst .h-pen{height:125px;width:10px;box-shadow:0 0 28px #fff,0 0 55px #ffd700}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="stage" id="st">
  <div class="board">KIỂM TRA 1 TIẾT</div>
  <div class="ground"></div>
  <div class="bar" style="left:20px"><i id="hHp" style="background:linear-gradient(90deg,#0f0,#0c0)"></i></div>
  <div class="tag" style="left:20px;color:var(--blue)">HỌC SINH</div>
  <div class="bar" style="right:20px"><i id="bHp" style="background:linear-gradient(90deg,red,#c00)"></i></div>
  <div class="tag" style="right:20px;color:var(--red)">BOSS ĐIỂM KÉM</div>

  <div class="hero" id="hero">
    <div class="h-hair"></div><div class="h-head"></div>
    <div class="h-eye" style="left:30px"></div><div class="h-eye" style="left:48px"></div>
    <div class="h-mouth"></div><div class="h-body"></div><div class="h-tie"></div>
    <div class="h-pants"></div><div class="h-bag"></div><div class="h-pen"></div>
    <div class="name" style="color:var(--blue)">HỌC SINH</div>
  </div>

  <div class="boss" id="boss">
    <div class="paper">
      <div class="grade">1</div>
      <div class="eye" style="left:30px"></div><div class="eye" style="right:30px"></div>
      <div class="mouth"></div>
      <div class="label">ĐIỂM KÉM</div>
    </div>
    <div class="name" style="color:var(--red)">BOSS ĐIỂM KÉM</div>
  </div>

  <div class="dlg" id="dlg"><b id="who"></b><span id="msg"></span></div>

  <div class="end" id="end">
    <h1>HẾT</h1>
    <p>Học sinh đã đạt điểm 10. Cảm ơn bạn đã xem!</p><p style="color:#ffd700">Luyện đề cùng nhân vật tại luyendemaster.vercel.app</p>
    <button onclick="location.reload()">▶ Xem lại</button>
  </div>
</div></div>

<script>
const $=id=>document.getElementById(id),st=$('st'),hero=$('hero'),boss=$('boss');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const GOLD=['#fff','#ffd700','#ff8c00'],INK=['#000080','#1e3a8a','#4169e1'];
let bh=100,hh=100;

function fit(){$('wrap').style.transform='scale('+Math.min(innerWidth/940,innerHeight/540,1.4)+')'}
fit();addEventListener('resize',fit);

function mk(css,html=''){const e=document.createElement('div');e.className='fx';e.style.cssText=css;e.innerHTML=html;st.appendChild(e);return e}
function anim(e,kf,o){const a=e.animate(kf,{fill:'forwards',...o});a.onfinish=()=>e.remove();return a}
function burst(x,y,n,cols,r=120){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,d=r*(.4+Math.random()*.6),s=5+Math.random()*9;
    const e=mk(`left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:${cols[i%cols.length]}`);
    anim(e,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:500+Math.random()*500});
  }
}
function shake(p=10,d=400){
  const k=[];for(let i=0;i<8;i++)k.push({transform:`translate(${(Math.random()-.5)*p*2}px,${(Math.random()-.5)*p*2}px)`});
  k.push({transform:'none'});st.animate(k,{duration:d});
}
function flash(c,d=450){anim(mk(`inset:0;background:${c};z-index:30`),[{opacity:.9},{opacity:0}],{duration:d})}
function banner(t,c){
  const e=mk(`left:0;right:0;top:120px;text-align:center;font:bold 42px 'Comic Sans MS',cursive;color:${c};background:linear-gradient(90deg,transparent,#000b 20%,#000b 80%,transparent);padding:8px 0;text-shadow:0 0 20px ${c},3px 3px 0 #000;z-index:25`,t);
  anim(e,[{transform:'translateX(-110%)',opacity:0},{transform:'none',opacity:1,offset:.2},{transform:'none',opacity:1,offset:.8},{transform:'translateX(110%)',opacity:0}],{duration:1500});
}
function floatText(x,y,t,c){anim(mk(`left:${x}px;top:${y}px;font:bold 32px 'Comic Sans MS',cursive;color:${c};text-shadow:2px 2px 0 #000;z-index:20`,t),[{transform:'translateY(0) scale(.5)',opacity:1},{transform:'translateY(-60px) scale(1.2)',opacity:0}],{duration:900})}
function hitBoss(d){
  d=Math.min(d,bh);if(!d)return;bh-=d;$('bHp').style.width=bh+'%';
  floatText(680,220,'-'+d,'#ffd700');
  boss.animate([{filter:'brightness(3)'},{filter:'none'}],{duration:250});
}
function hitHero(d){
  hh-=d;$('hHp').style.width=hh+'%';floatText(110,240,'-'+d,'#ff3333');
  hero.animate([{translate:'-12px'},{translate:'12px'},{translate:'0'}],{duration:300});
}
async function say(who,t,ms){
  $('who').textContent=who;$('who').style.color=who==='HỌC SINH'?'#6a8dff':'#ff5555';
  $('msg').textContent=t;$('dlg').classList.add('show');await wait(ms);$('dlg').classList.remove('show');await wait(350);
}

// Chiêu 1: Tia Công Thức
async function skillBeam(){
  banner('⚡ TIA CÔNG THỨC ⚡','#ffd700');hero.classList.add('atk');await wait(600);
  anim(mk('left:190px;top:310px;width:540px;height:26px;transform-origin:left;background:linear-gradient(90deg,transparent,#fff,#ffd700,#4169e1);border-radius:13px;box-shadow:0 0 30px #ffd700;z-index:8'),
    [{transform:'scaleX(0)',opacity:1},{transform:'scaleX(1)',opacity:1,offset:.4},{transform:'scaleX(1)',opacity:0}],{duration:900});
  [...'∑π√∫∞≠%²'].forEach((c,i)=>{
    const s=mk(`left:190px;top:${295+Math.random()*30}px;font:bold 34px serif;color:#fff;text-shadow:0 0 10px #ffd700;z-index:9`,c);
    anim(s,[{transform:'translate(0,0)',opacity:1},{transform:'translate(520px,0) rotate(360deg)',opacity:.9}],{duration:700,delay:i*70});
  });
  await wait(850);burst(700,322,34,GOLD,150);shake(8);hitBoss(18);hero.classList.remove('atk');await wait(900);
}

// Chiêu boss 1: Quên Bài
async function skillForget(){
  banner('☠ QUÊN BÀI ☠','#c77dff');boss.style.transform='translateX(-90px) rotate(-8deg)';await wait(700);
  for(let i=0;i<7;i++){
    const f=mk(`left:640px;top:${250+Math.random()*80}px;width:70px;height:70px;border-radius:50%;background:radial-gradient(#9b30ff,#4b0082aa,transparent);filter:blur(6px);z-index:8`);
    anim(f,[{transform:'translate(0,0) scale(.5)',opacity:1},{transform:`translate(-520px,${(Math.random()-.5)*80}px) scale(2)`,opacity:0}],{duration:1100,delay:i*90});
    const q=mk(`left:640px;top:${230+Math.random()*100}px;font:bold 36px Arial;color:#e0b0ff;z-index:9`,'?');
    anim(q,[{transform:'translate(0,0)',opacity:1},{transform:'translate(-500px,-30px) rotate(-200deg)',opacity:0}],{duration:1000,delay:i*90});
  }
  await wait(1100);boss.style.transform='none';flash('#7b2cbf',500);hitHero(15);shake(7);
  hero.animate([{filter:'hue-rotate(0)'},{filter:'hue-rotate(120deg) blur(1px)'},{filter:'none'}],{duration:900});
  await wait(900);
}

// Chiêu 2: Tam Liên Công Thức
async function skillCombo(){
  banner('✦ TAM LIÊN CÔNG THỨC ✦','#00e5ff');await wait(700);
  for(const f of ['E = mc²','S = πr²','a²+b²=c²']){
    hero.classList.add('atk');
    const e=mk('left:200px;top:290px;font:bold 30px serif;color:#fff;background:#0077ffcc;padding:4px 12px;border-radius:8px;box-shadow:0 0 25px #00e5ff;z-index:9',f);
    anim(e,[{transform:'translate(0,0) scale(.6)',opacity:1},{transform:'translate(470px,20px) scale(1.2)',opacity:1}],{duration:450});
    await wait(450);burst(690,320,18,['#00e5ff','#fff','#4169e1'],110);hitBoss(12);shake(5,250);
    hero.classList.remove('atk');await wait(220);
  }
  await wait(600);
}

// Chiêu boss 2: Mưa Bài Tập
async function skillRain(){
  banner('🌧 MƯA BÀI TẬP VỀ NHÀ 🌧','#ff4d4d');boss.style.transform='translateY(-30px) scale(1.1)';await wait(700);
  for(let i=0;i<16;i++){
    const x=40+Math.random()*420;
    const p=mk(`left:${x}px;top:-60px;width:44px;height:56px;background:#fff8dc;border:2px solid #8b0000;color:#c00;font:bold 11px Arial;text-align:center;padding-top:6px;z-index:8`,'BTVN<br><b style="font-size:18px">-1</b>');
    anim(p,[{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${380+Math.random()*30}px) rotate(${Math.random()*80-40}deg)`,opacity:1,offset:.85},{transform:`translateY(400px)`,opacity:0}],{duration:900,delay:i*70});
    setTimeout(()=>burst(x+22,430,5,['#c00','#fff8dc'],50),i*70+800);
  }
  await wait(1700);boss.style.transform='none';hitHero(20);shake(9);await wait(700);
}

// Tuyệt kỹ: Ôn Bài Thần Công
async function skillUltimate(){
  banner('🔥 ÔN BÀI THẦN CÔNG 🔥','#ff8c00');
  const dark=mk('inset:0;background:#10001f;z-index:6');anim(dark,[{opacity:0},{opacity:.75,offset:.15},{opacity:.75,offset:.85},{opacity:0}],{duration:5600});
  const aura=mk('left:60px;top:220px;width:160px;height:200px;border-radius:50%;background:radial-gradient(#ffd700,#ff8c0088 50%,transparent 70%);z-index:7');
  aura.animate([{transform:'scale(.9)',opacity:.7},{transform:'scale(1.4)',opacity:1}],{duration:350,iterations:Infinity,direction:'alternate'});
  for(let i=0;i<18;i++){const s=mk(`left:${70+Math.random()*140}px;top:430px;width:4px;height:${30+Math.random()*50}px;background:linear-gradient(#ffd700,transparent);z-index:7`);
    anim(s,[{transform:'translateY(0)',opacity:1},{transform:'translateY(-300px)',opacity:0}],{duration:900,delay:i*110});}
  await wait(1700);
  hero.style.transform='translateX(400px)';await wait(450);
  for(let i=0;i<5;i++){
    hero.classList.toggle('atk');
    const a=-50+Math.random()*100;
    anim(mk(`left:600px;top:${290+Math.random()*30}px;width:260px;height:7px;background:linear-gradient(90deg,transparent,#fff,#ffd700,transparent);box-shadow:0 0 20px #ffd700;transform:rotate(${a}deg);z-index:9`),
      [{opacity:1,clipPath:'inset(0 100% 0 0)'},{opacity:1,clipPath:'inset(0 0 0 0)',offset:.5},{opacity:0}],{duration:420});
    burst(730,310,14,INK,100);hitBoss(6);shake(6,180);await wait(300);
  }
  hero.classList.remove('atk');hero.style.transform='none';await wait(500);
  const pen=mk('left:722px;top:-340px;width:22px;height:300px;background:linear-gradient(90deg,#b8860b,#ffd700,#fff,#ffd700,#b8860b);border-radius:4px 4px 0 0;box-shadow:0 0 40px #ffd700;z-index:9',
    '<div style="position:absolute;bottom:-40px;left:-1px;border:11px solid transparent;border-top:40px solid #222;border-bottom:0"></div>');
  anim(pen,[{transform:'translateY(0)'},{transform:'translateY(560px)',offset:.8},{transform:'translateY(560px)',opacity:0}],{duration:900,easing:'ease-in'});
  await wait(750);flash('#fff',700);shake(22,700);burst(733,320,60,GOLD.concat(INK),230);hitBoss(100);
  await wait(1100);
}

async function finale(){
  await say('BOSS ĐIỂM KÉM','KHÔNG THỂ... NGƯƠI... ĐÃ ÔN BÀI... SAO...',2400);
  boss.classList.add('dying');
  for(const [x,y] of [[650,250],[720,200],[610,300]]){burst(x,y,30,['#fff','#ffd700','#ff6347'],150);shake(8,200);await wait(350);}
  await wait(1500);
  const w=mk('left:50%;top:42%;font:bold 60px \'Comic Sans MS\',cursive;color:#ffd700;text-shadow:0 0 30px red,4px 4px 0 #8b0000;z-index:20;transform-origin:center','CHIẾN THẮNG!');
  w.style.transform='translate(-50%,-50%)';
  w.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:900,fill:'forwards',easing:'cubic-bezier(.2,1.6,.4,1)'});
  [['10',330,250],['10',480,280],['10',200,270]].forEach(([t,x,y],i)=>{
    anim(mk(`left:${x}px;top:${y}px;font:bold 100px 'Comic Sans MS',cursive;color:#0a0;text-shadow:0 0 30px #0f0,4px 4px 0 #050;z-index:15`,t),
      [{transform:'translateY(0) scale(0)',opacity:0},{transform:'translateY(-60px) scale(1.4)',opacity:1,offset:.3},{transform:'translateY(-170px) scale(1)',opacity:0}],{duration:2200,delay:i*400});
  });
  for(let i=0;i<50;i++){
    const c=mk(`left:${Math.random()*880}px;top:-20px;width:9px;height:14px;background:hsl(${Math.random()*360},90%,60%);z-index:18`);
    anim(c,[{transform:'translateY(0) rotate(0)'},{transform:`translateY(540px) rotate(${Math.random()*720}deg)`}],{duration:1800+Math.random()*1500,delay:Math.random()*1200});
  }
  hero.animate([{transform:'translateY(0)'},{transform:'translateY(-18px)'}],{duration:400,iterations:8,direction:'alternate'});
  await wait(900);
  await say('HỌC SINH','Mình đã chiến thắng! Điểm 10 rồi! Về nhà ăn cơm thôi!',3200);
  await wait(800);
  $('end').classList.add('show');
}

async function run(){
  await wait(600);
  await say('BOSS ĐIỂM KÉM','Ha ha ha! Ta là Điểm Kém! Ngươi sẽ trượt môn mãi mãi!',2800);
  await say('HỌC SINH','Mình đã ôn bài cả tuần rồi! Không sợ ngươi đâu!',2600);
  await say('BOSS ĐIỂM KÉM','Ngu ngốc! Hãy nếm thử sức mạnh của sự lười biếng!',2300);
  await say('HỌC SINH','Vũ khí của mình là... BÚT KIẾM VÀ KIẾN THỨC!',2300);
  await skillBeam();
  await say('BOSS ĐIỂM KÉM','Áaaa! Câu trả lời đúng quá! Nhưng đây là QUÊN BÀI!',2000);
  await skillForget();
  await say('HỌC SINH','Hự... Mình suýt quên hết rồi! Nhưng chưa xong đâu!',2000);
  await skillCombo();
  await say('BOSS ĐIỂM KÉM','ĐỦ RỒI! BÀI TẬP VỀ NHÀ ĐÂY!!!',1800);
  await skillRain();
  await say('HỌC SINH','Mình sẽ dùng hết kiến thức đã ôn! TUYỆT KỸ CUỐI CÙNG!',2200);
  await skillUltimate();
  await finale();
}

let MUTE=false,VOI=null,BA=[];
const TTS=false;
let PICK='';
function fillSel(L){
  const s=window.vsel;if(!s)return;
  s.innerHTML=L.length?L.map(v=>`<option value="${v.name}"${VOI&&VOI.name===v.name?' selected':''}>${v.name}</option>`).join(''):'<option>Máy không có giọng Việt</option>';
  s.disabled=!L.length;
}
function pickVoice(){
  if(!TTS)return;
  const L=speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang));
  const sc=v=>(/natural|online/i.test(v.name)?4:0)+(/google/i.test(v.name)?3:0)+(/hoaimy|namminh|linh/i.test(v.name)?2:0)+(v.localService?0:1);
  VOI=L.find(v=>v.name===PICK)||[...L].sort((a,b)=>sc(b)-sc(a))[0]||null;
  fillSel(L);
}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(who,t){
  return new Promise(res=>{
    if(MUTE||!TTS)return res();
    const u=new SpeechSynthesisUtterance(t.replace(/[^\p{L}\p{N}\s.,!?'"-]/gu,' '));
    if(VOI)u.voice=VOI;u.lang=VOI?VOI.lang:'vi-VN';
    const b=who.startsWith('BOSS');u.pitch=b?.8:1.1;u.rate=.95;
    u.onend=()=>res();u.onerror=()=>res();
    speechSynthesis.cancel();speechSynthesis.speak(u);setTimeout(res,9000);
  });
}

// ===== V8: Âm thanh (WebAudio, tạo từ code) + tự động phát cutscene =====
let AC=null,MG=null;
try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.6;MG.connect(AC.destination)}catch(e){AC=null}
const ok=()=>AC&&AC.state==='running'&&!MUTE;
const last={};const th=(k,ms)=>{const n=performance.now();if(n-(last[k]||0)<ms)return false;last[k]=n;return true};
function tone(f,d,type='sine',v=.2,to=null,at=0){
  if(!ok())return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(Math.max(to,20),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.2,f=1000,type='lowpass',at=0){
  if(!ok())return;const t=AC.currentTime+at,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(g);g.connect(MG);s.start(t);
}

// Nhạc nền theo từng giai đoạn
const MOODS={
  calm:{bpm:84,root:57,sc:[0,3,7,10],bass:'sine',kick:0,hat:0,v:.07},
  study:{bpm:100,root:60,sc:[0,4,7,11],bass:'sine',kick:0,hat:0,v:.08},
  battle:{bpm:142,root:52,sc:[0,3,7,10],bass:'sawtooth',kick:1,hat:1,v:.09},
  rage:{bpm:168,root:46,sc:[0,1,7,8],bass:'sawtooth',kick:1,hat:1,v:.11},
  epic:{bpm:152,root:57,sc:[0,4,7,12],bass:'sawtooth',kick:1,hat:1,v:.1}
};
let mood='calm',stp=0;
const mf=n=>440*Math.pow(2,(n-69)/12);
function mtick(){
  const m=MOODS[mood];
  if(m&&ok()){
    const i=stp%16,r=m.root+[0,-4,-2,-5][(stp>>4)%4];
    if(i%4===0)tone(mf(r-12),.45,m.bass,m.v*1.4);
    if(i%2===0)tone(mf(r+12+m.sc[(i>>1)%4]),.2,'triangle',m.v);
    if(m.kick&&i%8===0)tone(150,.2,'sine',.3,40);
    if(m.hat&&i%2===1)noise(.04,.05,7000,'highpass');
    stp++;
  }
  setTimeout(mtick,m?60000/m.bpm/4:250);
}
